<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Xevonet E-Card</title>
    <link rel="stylesheet" href="/landing.css">
    <style>
        .dash-wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
        .dash-wrap h1 { font-family: Poppins, sans-serif; font-size: 1.75rem; margin-bottom: 12px; }
        .dash-wrap p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .dash-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    </style>
</head>
<body>
    <div class="dash-wrap">
        <h1>Your dashboard</h1>
        <p>
            Analytics and card editing will appear here once you sign in with the email you used at checkout.
            Your confirmation email includes a link to this page.
        </p>
        <p>If you were given a different dashboard URL by support, use that link instead.</p>
        <div class="dash-actions">
            <a class="btn btn-primary" href="/form.html">Card generator</a>
            <a class="btn btn-ghost" href="/">Home</a>
        </div>
    </div>
</body>
</html>
